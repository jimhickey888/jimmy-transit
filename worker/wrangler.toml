# Deploy with: npx wrangler deploy
# Free plan supports cron triggers; the interval below needs 1-minute crons.

name = "jimmy-transit-push"
main = "worker.js"
compatibility_date = "2026-11-01"

[triggers]
# The minute cron is a watchdog; with the Durable Object binding the alarm
# actually sends at the due second.
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "AlertScheduler"

# SQLite-backed Durable Objects are available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertScheduler"]

# Create the namespace first: npx wrangler kv namespace create ALERTS
# then replace the id below with the one it prints.
[[kv_namespaces]]
binding = "ALERTS"
id = "08bb001be7904c1787a7dbd203a09373"

[vars]
VAPID_SUBJECT = "mailto:jimhickey888@users.noreply.github.com"
