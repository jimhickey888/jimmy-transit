<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Durable Object scheduler test</title>
<style>
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 20px; }
  .pass { color: #0b7a45; }
  .fail { color: #c00; font-weight: 700; }
</style>
</head>
<body>
<h1>Durable Object scheduler test</h1>
<p>Serve the repo with <code>python3 -m http.server 8000</code> and open
<code>/worker/test/do-scheduler-test.html</code>. It exercises the
<code>AlertScheduler</code> class with fake storage, so the alarm timing and
storage logic can be checked before deploying.</p>
<pre id="out">running…</pre>

<script type="module">
import { AlertScheduler } from '../worker.js';

const out = document.getElementById('out');
const lines = [];
let failures = 0;

function check(name, ok, detail = '') {
  if (!ok) failures += 1;
  lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? ` — ${detail}` : ''}`);
  out.innerHTML = lines.map((line) => (
    line.startsWith('PASS') ? `<span class="pass">${line}</span>`
      : line.startsWith('FAIL') ? `<span class="fail">${line}</span>` : line
  )).join('\n');
}

function b64url(bytes) {
  let binary = '';
  for (const byte of new Uint8Array(bytes)) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function makeState() {
  const map = new Map();
  let alarm = null;
  return {
    map,
    get alarm() { return alarm; },
    storage: {
      async get(key) { return map.get(key); },
      async put(key, value) { map.set(key, value); },
      async getAlarm() { return alarm; },
      async setAlarm(at) { alarm = at; },
    },
  };
}

async function main() {
  const state = makeState();

  const signing = await crypto.subtle.generateKey(
    { name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign'],
  );
  const jwk = await crypto.subtle.exportKey('jwk', signing.privateKey);
  const vapidPublic = new Uint8Array(await crypto.subtle.exportKey('raw', signing.publicKey));

  const ua = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits'],
  );
  const uaPublic = new Uint8Array(await crypto.subtle.exportKey('raw', ua.publicKey));
  const subscription = {
    endpoint: 'https://example.test/push',
    keys: {
      p256dh: b64url(uaPublic),
      auth: b64url(crypto.getRandomValues(new Uint8Array(16))),
    },
  };

  const env = {
    VAPID_PRIVATE_JWK: JSON.stringify(jwk),
    VAPID_PUBLIC_KEY: b64url(vapidPublic),
    VAPID_SUBJECT: 'mailto:test@example.com',
  };

  const realFetch = window.fetch;
  let pushCalls = 0;
  window.fetch = async (url, options) => {
    if (String(url).startsWith('https://example.test/push')) {
      pushCalls += 1;
      return new Response('', { status: 201 });
    }
    return realFetch(url, options);
  };

  const scheduler = new AlertScheduler(state, env);
  const now = Date.now();

  const schedule = async (alerts) => {
    const response = await scheduler.fetch(new Request('https://scheduler/alerts', {
      method: 'POST',
      body: JSON.stringify({ subId: 'test', subscription, alerts }),
    }));
    return response.json();
  };

  const alert = (id, fireAt) => ({
    id, fireAt, title: `85 ${id}`, body: 'Healthy Village', tag: id,
  });

  const first = await schedule([alert('a', now + 30000), alert('b', now + 60000)]);
  check('schedule accepts two alerts', first.ok === true && first.alerts === 2);
  check('alarm set to the earliest alert', Math.abs(state.alarm - (now + 30000)) < 1500, `alarm=${state.alarm}`);

  const count = await scheduler.fetch(new Request('https://scheduler/alerts')).then((r) => r.json());
  check('count reports both alerts', count.count === 2, `count=${count.count}`);

  await scheduler.alarm();
  check('early alarm sends nothing', pushCalls === 0, `pushes=${pushCalls}`);

  // Make alert "a" due and fire the alarm.
  const stored = state.map.get('alerts').map((item) => (
    item.id === 'a' ? { ...item, fireAt: now - 1000 } : item
  ));
  state.map.set('alerts', stored);
  await scheduler.alarm();
  check('alarm sends the due alert', pushCalls === 1, `pushes=${pushCalls}`);
  const afterSend = state.map.get('alerts');
  check('sent alert is removed', !afterSend.some((item) => item.id === 'a'));
  check('remaining alert keeps its time', afterSend.length === 1 && afterSend[0].id === 'b');
  check('alarm moves to the remaining alert', Math.abs(state.alarm - (now + 60000)) < 2000, `alarm=${state.alarm}`);

  const cancelled = await scheduler.fetch(new Request('https://scheduler/alert?id=b', { method: 'DELETE' }));
  check('delete accepts', (await cancelled.json()).ok === true);
  const afterCancel = await scheduler.fetch(new Request('https://scheduler/alerts')).then((r) => r.json());
  check('delete removes the alert', afterCancel.count === 0);
  check('empty schedule sets an idle alarm', state.alarm > Date.now() + 30 * 60 * 1000, `alarm=${state.alarm}`);

  // Rescheduling the same id replaces the record and pulls the alarm earlier.
  await schedule([alert('c', now + 60000)]);
  const alarmLater = state.alarm;
  await schedule([alert('c', now + 20000)]);
  check('same id is upserted', state.map.get('alerts').filter((item) => item.id === 'c').length === 1);
  check('earlier reschedule pulls the alarm in', state.alarm < alarmLater, `alarm=${state.alarm}`);

  // Watchdog sends a due alert even if the alarm was lost.
  state.map.set('alerts', state.map.get('alerts').map((item) => ({ ...item, fireAt: now - 1000 })));
  state.storage.setAlarm(null);
  const beforeWatchdog = pushCalls;
  await scheduler.fetch(new Request('https://scheduler/watchdog', { method: 'POST' }));
  check('watchdog sends overdue alerts', pushCalls === beforeWatchdog + 1, `pushes=${pushCalls}`);
  check('watchdog clears the queue', state.map.get('alerts').length === 0);

  lines.push('');
  lines.push(failures ? `${failures} CHECK(S) FAILED` : 'ALL CHECKS PASSED');
  out.innerHTML = lines.map((line) => {
    if (line.startsWith('FAIL') || line.includes('FAILED')) return `<span class="fail">${line}</span>`;
    if (line.startsWith('PASS')) return `<span class="pass">${line}</span>`;
    return line;
  }).join('\n');

  window.fetch = realFetch;
}

main().catch((error) => {
  check('test harness ran', false, error && error.message);
  console.error(error);
});
</script>
</body>
</html>
