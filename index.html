<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jimmy Bus Tracker</title>
  <meta name="description" content="Live arrivals for buses around Braemar Hill, Hong Kong.">
  <meta name="theme-color" content="#0b7a45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jimmy Bus Tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="titles">
        <h1 id="title">Citybus</h1>
        <p class="sub" id="sub">27 · 85 · 25A · 25</p>
      </div>
      <button id="refresh" class="refresh" type="button" aria-label="Refresh arrivals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.6 6.3"/>
          <path d="M20 4v7h-7"/>
        </svg>
      </button>
    </header>

    <div class="statusline">
      <span id="dot" class="dot"></span>
      <span id="updated" aria-live="polite">Connecting…</span>
      <nav id="pdots" class="pdots" aria-label="Pages"></nav>
    </div>

    <div id="pager" class="pager"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
